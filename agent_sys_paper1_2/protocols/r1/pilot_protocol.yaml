# R1-P: Instrumentation and label pilot protocol
# Version 1.0 · 2026-08-01
# This protocol is mutable during the pilot phase.
# Frozen after pilot gates pass. See deviations.md for changes.

protocol_id: R1-P
paper: R1
version: "1.0"
status: pilot
frozen_date: null
supersedes: null

purpose: >
  Determine whether the trace contract observes the intended mechanisms,
  whether injectors work without contaminating controls, and whether
  adjudicators can apply the label book consistently.

experimental_design:
  design_type: mixed_level_d_optimal
  blocking: [task_instance, model_configuration, workload_family, resource_tier]
  block_randomization: seeded_schedule
  randomization_seed: "R1-P-2026-08-01-seed-v1"
  run_order: block_randomized_within_calendar_batch

factors:
  - name: workload_family
    type: categorical
    levels: [repository_repair, reproducible_ml_experiment]
    status: pilot_only
  - name: task_instance
    type: categorical
    levels_per_family: 6
    total_levels: 12
    status: pilot_only
    nesting: nested_in_workload_family
  - name: model_configuration
    type: categorical
    levels: [open_local_model, api_served_model]
    status: pilot_only
  - name: condition
    type: categorical
    levels: [no_fault, mechanism_1, mechanism_2, mechanism_3, mechanism_4, mechanism_5, mechanism_6]
    status: pilot_only
    controls:
      no_fault_control: no_fault
      benign_control: benign_perturbation_not_triggering_failure
  - name: fault_severity
    type: ordinal
    levels: [low, medium, high]
    status: pilot_only
    assignment: balanced_across_task_blocks
  - name: injection_band
    type: ordinal
    levels: [early, middle, late]
    status: pilot_only
    assignment: balanced_across_task_blocks
  - name: replicate_seed
    type: categorical
    levels: 2
    status: pilot_only

replicates:
  seeds_per_cell: 2
  planned_trajectories: 336
  calculation: 2_workloads × 6_tasks × 2_models × 7_conditions × 2_seeds
  invalid_run_replacement: true
  replacement_rule: predeclared_censoring_with_replacement

fault_injection_rules:
  assignment: block_randomized_sealed_manifest
  policy_visibility: sealed_from_evaluated_policy
  fidelity_measurement: proportion_assigned_with_intended_immediate_state_difference
  contamination_measurement: proportion_no_fault_runs_exhibiting_injected_mechanism
  severity_and_timing: mixed_level_D_optimal_assignment_not_fully_crossed

design_matrix_checks:
  - estimability_of_prespecified_main_effects
  - estimability_of_prespecified_two_factor_interactions
  - variance_inflation_diagnostics
  - condition_number
  - balance_by_block
  - aliased_or_unsupported_interaction_report

primary_pilot_measurements:
  - id: injection_fidelity
    definition: proportion_of_assigned_faults_with_intended_immediate_state_difference
    target: ">= 0.90"
  - id: control_contamination
    definition: proportion_of_no_fault_runs_exhibiting_injected_mechanism
    target: "<= 0.02"
  - id: observation_completeness
    definition: fraction_of_required_event_and_snapshot_fields_present_at_eligible_steps
    target: ">= 0.98"
  - id: causal_label_agreement
    definition: agreement_on_controlled_root_cause_family_excluding_injector_failures
    target: "krippendorff_alpha >= 0.70"
  - id: onset_agreement
    definition: weighted_agreement_within_declared_tolerance_window
    target: "median_absolute_difference <= 2_eligible_steps"
  - id: replay_fidelity
    definition: proportion_of_deterministic_runs_reproducing_terminal_state_and_trace_outcomes
    target: ">= 0.95"
  - id: cost_distribution
    definition: tokens_wall_time_tool_calls_storage_adjudication_minutes_per_trajectory
    target: recorded_not_gated

pilot_gates:
  - gate: injection_fidelity
    threshold: "0.90"
    response_if_missed: repair_or_drop_injector_do_not_relabel_failed_injections_as_faults
  - gate: no_fault_contamination
    threshold: "0.02"
    response_if_missed: fix_task_or_observer_repeat_affected_controls
  - gate: required_field_completeness
    threshold: "0.98"
    response_if_missed: fix_instrumentation_before_scaling
  - gate: root_cause_agreement
    threshold: "alpha_0.70"
    response_if_missed: narrow_hierarchy_or_use_set_valued_ambiguous_labels
  - gate: onset_agreement
    threshold: "median_2_steps"
    response_if_missed: redefine_onset_rule_or_use_interval_censored_onset
  - gate: deterministic_replay
    threshold: "0.95"
    response_if_missed: separate_non_replayable_tasks_or_repair_snapshot_boundary

invalid_run_disposition:
  categories:
    - policy_termination
    - budget_exhaustion
    - infrastructure_failure
    - injector_failure
    - observer_failure
    - verifier_failure
    - scientific_task_failure
    - unknown
  analysis: intention_to_treat_retains_all_valid_assignments
  sensitivity: per_protocol_excludes_injector_or_infrastructure_failures_not_primary

pilot_exclusion_from_confirmatory: true
pilot_uses: [instrument_repair, power_estimation, label_book_revision]
pilot_excluded_from: [confirmatory_claims, confirmatory_estimates]
