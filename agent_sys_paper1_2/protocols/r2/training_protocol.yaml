# R2-T: Matched post-training experiment protocol
# Version 1.0 · 2026-08-01
# Frozen after R2 controller gate passes. Immutable after training begins.

protocol_id: R2-T
paper: R2
version: "1.0"
status: prospective
frozen_date: null
depends_on: [R2-C, R1-C]

purpose: >
  Test whether independently verified process information adds value beyond
  successful-only imitation and terminal reward. This is the causal comparison
  supporting H4.

training_arms:
  - id: arm_1_base
    name: base_model
    training_information: none
    purpose: establish_unadapted_recovery_and_clean_task_behavior
  - id: arm_2_successful_sft
    name: successful_only_sft
    training_information: valid_terminal_trajectories_only
    purpose: test_ordinary_successful_imitation
  - id: arm_3_recovery_sft
    name: recovery_sft
    training_information: failed_and_verified_repaired_transitions
    purpose: isolate_value_of_recovery_examples
  - id: arm_4_outcome_only
    name: outcome_only_optimization
    training_information: independent_terminal_reward
    purpose: test_whether_terminal_feedback_is_sufficient
  - id: arm_5_process_supervised
    name: process_supervised_optimization
    training_information: independent_step_and_transition_evidence
    purpose: test_process_information_value
  - id: arm_6_process_plus_abstention
    name: process_supervised_with_calibrated_abstention
    training_information: process_evidence_plus_held_out_calibration
    purpose: test_selective_safety_and_over_intervention

data_and_compute_matching:
  trajectory_count: matched_across_trainable_arms
  effective_tokens: matched
  optimizer_steps: matched
  evaluation_budget: matched
  mismatch_reporting: any_unavoidable_mismatch_reported

model_and_training:
  model_family: one_open_model_family
  adaptation: parameter_efficient
  training_seeds: at_least_3_per_trainable_arm
  checkpoint_selection: fixed_before_test_using_development_outcomes_only
  test_optimization_prohibited: true

training_curriculum:
  - phase: recovery_sft
    description: teach_typed_diagnosis_verification_requests_recovery_selection_abstention
    source: accepted_trajectories
  - phase: one_process_optimization
    description: single_rlvr_or_equivalent_with_independent_step_evidence_and_costs
    extensions_deferred: [dpo, multiple_rl_algorithms, larger_models, distributed_training]
  - phase: calibration_pass
    description: fit_or_recalibrate_warning_and_abstention_outputs
    split: held_out_calibration_split

evaluation_sets:
  - id: seen_task_seen_fault
    purpose: verify_basic_learning_and_debug_failure
  - id: unseen_task_templates
    purpose: test_task_transfer
  - id: unseen_injector_implementations
    purpose: test_mechanism_rather_than_artifact_learning
  - id: unseen_fault_compositions
    purpose: primary_recovery_generalization_test
  - id: unknown_fault_family
    purpose: test_abstention_and_safe_escalation
  - id: clean_tasks
    purpose: non_inferiority_and_unnecessary_intervention_test
  - id: verifier_substitution
    purpose: reward_channel_robustness
  - id: environment_provider_shift
    purpose: calibration_and_operational_robustness

primary_endpoints:
  H4_recovery:
    endpoint_id: R2-T-primary-recovery
    formula: >
      verified_recovery_rate_on_unseen_fault_compositions
      process_supervised_vs_stronger_of_recovery_sft_and_outcome_only
      at_matched_evaluation_cost
    minimum_effect: ">= 0.05 absolute improvement"
    interval: grouped_95pct_excluding_zero
  H4_co_primary_safety:
    endpoint_id: R2-T-co-primary-noninferiority
    formula: >
      clean_task_verified_success_relative_to_same_base_model_evaluation
    non_inferiority_margin: -0.02
    requirement: lower_confidence_bound_above_neg_0_02

evidence_thresholds:
  - verified_recovery_improvement_over_strongest_comparator_5pp
  - grouped_95pct_interval_excludes_zero
  - clean_task_lower_bound_above_non_inferiority
  - selective_risk_or_risk_coverage_improvement_after_calibration
  - improvement_survives_verifier_substitution_and_near_duplicate_removal
  - no_single_training_seed_task_family_or_fault_family_explains_result

R2_A_factorial_ablation:
  design: 2x2x2_factorial
  factors:
    - name: calibrated_r1_belief
      off: raw_score_or_no_belief
      on: calibrated_hazard_and_cause_distribution
    - name: active_verification
      off: fixed_or_none
      on: budget_aware_choice
    - name: process_supervision
      off: terminal_outcome_only
      on: independently_verified_transitions
  critical_interaction: active_verification_x_process_supervision
  arm_reuse: where_identical_to_primary_arm_reuse_exact_checkpoint
  no_retraining_under_new_label: true

negative_result_fallback:
  if_process_supervision_fails: >
    Report the negative comparison. R2 may still be publishable around the
    controller and verified-intervention dataset if H3 and artifact gates are strong.
  prohibited: redefining_primary_contrast_post_hoc

robustness_and_safety_gates:
  - training_verifiers_and_evaluation_verifiers_separated_when_feasible
  - reward_channels_audited_for_leakage_self_confirmation_shared_bugs
  - frozen_clean_tasks_test_unnecessary_interventions_and_over_abstention
  - unseen_fault_compositions_included_memorizing_named_injectors_not_recovery
  - irreversible_actions_require_stronger_evidence_or_human_approval
  - failed_and_ambiguous_adjudications_remain_in_analysis_set
  - any_claimed_improvement_survives_matched_budget_and_compute_comparisons
