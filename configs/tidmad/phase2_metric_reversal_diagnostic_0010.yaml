# TIDMAD Phase 2 -- DIAGNOSTIC exploration on abra_validation_0010.h5.
#
# NOT the primary/headline attempt (that is
# phase2_metric_reversal_real_noise.yaml, on abra_validation_0000.h5). This
# file was chosen after diagnosing why abra_validation_0000.h5's Phase 3 rank
# test failed (a genuine two-tone reference signal there), specifically to
# check a spectrally-confirmed single-tone file -- see
# docs/results/TIDMAD_PHASE2_3_REAL_RESULT.md. Result: direction of the
