schema_version: 1
run_kind: study_a
data_dir: noise_module/Al2O3_Al_athermal
component_files:
  SQUID: SQUID_noise.dat
  Johnson: Johnson_noise.dat
  TD: TD_noise.dat
  Er: Er_noise.dat
total_file: total_noise.dat
# Internal decade edges (Hz). Native support is split into
# len(band_edges_hz) + 1 half-open bands: [f_min, e0), [e0, e1), ...,
# [e_{n-1}, e_n), [e_n, f_max]. Reproduces the checked-in Study A export's
# band structure (EXP-02 acceptance regression snapshot).
band_edges_hz: [100.0, 1000.0, 10000.0, 100000.0, 1000000.0]
crossover_interpolation: log_frequency_linear
quadrature_tolerance:
  max_frac_dev: 0.01
  rms_frac_dev: 0.01
output_dir: results/noise_budget
