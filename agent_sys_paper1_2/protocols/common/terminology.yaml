# Shared terminology for Papers R1 and R2
# Version 1.0 · 2026-08-01
# Changes require a versioned protocol deviation record.

version: "1.0"
frozen: 2026-08-01

experimental_hierarchy:
  experimental_unit: trajectory
  description: >
    A trajectory is the experimental unit for intervention assignment and primary analysis.
    Events and steps within a trajectory are repeated observations (longitudinal measurements),
    never independent replicates.
  levels:
    - name: task_template
      definition: Shared generator, repository, dataset, or workflow skeleton
      role: grouping_unit
    - name: task_instance
      definition: One independently parameterized scientific problem
      role: primary_independent_sampling_unit
    - name: fault_episode
      definition: A sealed fault assignment within a task instance
      role: treatment_unit_nested_in_task
    - name: trajectory
      definition: One agent run under one assigned condition and seed
      role: experimental_unit_for_policy_assignment
    - name: event_or_step
      definition: Repeated observation within a trajectory
      role: longitudinal_measurement_not_independent
    - name: checkpoint
      definition: Model state produced by one training seed
      role: training_replicate_nested_in_method_arm

outcome_definitions:
  terminal_execution_failure:
    definition: The agent run did not complete to a declared terminal state.
    excludes: [timeout_budget, policy_termination]
  terminal_scientific_invalidity:
    definition: >
      The scientific claim at trajectory termination does not satisfy the
      independent adjudicator's validity criteria. Distinct from execution success.
  failure_onset:
    definition: >
      The first trajectory step where an adjudicator identifies a state that,
      if left uncorrected, would cause terminal scientific invalidity.
    measurement: interval-censored between last valid step and first invalid step.
  recovery:
    definition: >
      An intervention after failure onset that results in subsequent
      independently verified scientific validity.
    requires: [fault_removal, consistent_downstream_state, final_scientific_validity]
  verifier_failure:
    definition: >
      The verification mechanism itself produced an incorrect acceptance or rejection.
      Distinct from a task failure that was correctly detected.

trace_field_groups:
  identity: [run_id, campaign_id, task_id, task_family, replicate_id]
  versions: [git_commit, dirty_tree_digest, environment_lock_hash, schema_version]
  agent: [provider, model_id, model_revision, decoding_configuration, scaffold_version]
  resources: [wall_clock_budget, token_budget, tool_call_budget, compute_class]
  assignment: [experimental_arm, block, randomization_seed, split_name]
  fault: [sealed_fault_manifest_hash]
  evaluation: [adjudicator_versions, primary_endpoint_version, analysis_plan_hash]
  governance: [editable_paths, network_policy, secret_policy, approval_requirements]

