name: noise-module

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./noise_module[test]
      - run: pytest -q noise_module/noise_module/tests
      - run: python noise_module/examples/end_to_end.py
