# TIDMAD Phase 3 on REAL validation data -- the rank axis against a
# closed-form prediction (gate G3). The sharpest theory test in the stage:
# span{cos, sin} at the injected frequency is the analytically known signal
# manifold, and this checks whether the learned rank-2 subspace aligns with
# it on REAL data, not synthetic.
#
# This is the PRIMARY, first-attempt real-data run: abra_validation_0000.h5,
# matching phase2_metric_reversal_real_noise.yaml's file. The frequency is
# resolved automatically per-file via the contract's
# injection_frequencies_by_file map (docs/tidmad_data_contract.json;
# TidmadDataContract.frequency_for_file) -- no need to hardcode it here.
#
# This file's reference channel carries a persistent, genuine two-tone
# signal (~69510/69640 Hz, ~120 Hz apart) rather than a single tone -- a
# richer manifold than span{cos,sin}, which is why this run does not show
# the predicted rank-2 gain. A separate diagnostic exploration on
# abra_validation_0010.h5 (confirmed single-tone, but weak reference-to-SQUID
# coupling) lives in phase3_rank_manifold_diagnostic_0010.yaml with its own
# distinct output path, and a genuinely confirmatory attempt on a
# predeclared-rule-selected file lives in phase3_rank_manifold_confirmatory.yaml.
# Do NOT point this config at any other file -- its output would collide with
# this one's, exactly as happened once already (see OPEN_ISSUES.md item 6 /
# git history 2026-07-27).
#
# Same frozen operating point as the synthetic gate --
# docs/results/TIDMAD_PREDECLARED_GATES.md Section 5.
experiment_id: TIDMAD_P3_REAL
dataset: tidmad
phase: 3
mode: file

seed: 20260727
window_samples: 4096
n_windows: 512
n_calibration_windows: 256

ranks: [1, 2, 3, 4]
fit_fraction: 0.7
guard_windows: 4
bootstrap_reps: 300

data_root: /ceph/dwong/paper1_dataset
contract: docs/tidmad_data_contract.json
validation_glob: tidmad/raw/abra_validation_0000.h5
science_glob: tidmad/raw/abra_science_*.h5

output: results/metrics/TIDMAD_P3_real_seed20260727.json
