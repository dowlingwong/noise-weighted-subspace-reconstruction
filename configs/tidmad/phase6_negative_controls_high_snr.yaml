# TIDMAD Phase 6 -- negative controls (all five must degrade).
#
# Phase 2's positive result is compatible with a pipeline that would report a
# win no matter what it was fed. These controls break one ingredient at a time
# and require the primary metric to degrade with a bootstrap interval excluding
# zero. Matched one-for-one with the CRESST control set so both real-data
# stages are falsifiable in the same way.
#
# High-SNR variant. Its purpose is severity ranking, not falsification: at
# SNR 40 a wrong-but-still-coloured PSD retains partial recovery while the
# other four controls collapse, which reproduces CRESST's finding that
# wrong-PSD weighting is the weakest of the five.
experiment_id: TIDMAD_P6_HIGH_SNR
dataset: tidmad
phase: 6
mode: synthetic

seed: 20260727
window_samples: 4096
n_windows: 512
n_calibration_windows: 256
sampling_frequency: 10000000.0
frequency: 1000000.0
snr: 40.0

rank: 2
fit_fraction: 0.7
guard_windows: 4
bootstrap_reps: 300
wrong_frequency_offset_bins: 37   # predeclared: an empty part of the spectrum

psd_kind: pink
output: results/metrics/TIDMAD_P6_highsnr_synthetic_seed20260727.json
